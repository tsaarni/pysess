[project]
name = "pysess"
version = "0.1.0"
description = "Persistent Python REPL sessions for coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tero Saarni", email = "tero.saarni@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["python", "repl", "session", "agent", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
pysess = "pysess.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "W", "N", "C4", "PIE", "RET", "RSE", "PERF",
    "FURB", "PGH", "LOG", "G", "ARG", "ERA",
    "A", "PT", "PTH", "BLE", "DTZ", "PLE", "PLW",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
